  };

  window.openKickModal = function (id) {
    const t = chatMembers.find((x) => x.user_id === id);
    if (!t || !canKick(t)) return;
    openModal(`<h3>Исключить участника?</h3>
      <p><b>${esc(t.name || t.email)}</b> (${roleLabel(t.role)}) потеряет доступ к журналу и не сможет войти снова, пока владелец не вернёт его.</p>
      <form id="kickForm" data-id="${t.user_id}">
        <label class="field">Причина<input name="reason" maxlength="120" placeholder="Необязательно"></label>
        <div class="modal-actions">
          <button type="button" class="btn ghost" data-action="modal-close">Отмена</button>
          <button class="btn danger" type="submit">${icon("kick", 14)} Исключить</button>
        </div>
      </form>`);
  };

  window.sendChat = async function (body) {
    const text = String(body || "").trim();
    if (!text || chatSending || !isStaff()) return;
    chatSending = true;
    try {
      const { error } = await client.from("hifz_messages").insert({
        user_id: member.user_id,
        author_name: member.name || "Участник",
        author_role: member.role,
        body: text,
      });
      if (error) throw error;
      await loadChatData();
      renderChat();
      Sound.play("save");
    } finally {
      chatSending = false;
    }
  };

  window.deleteChatMessage = async function (id) {
    const { error } = await client.from("hifz_messages").delete().eq("id", id);
    if (error) throw error;
    chatMessages = chatMessages.filter((m) => m.id !== id);
    renderChatMessages();
    toast("Сообщение удалено", { type: "info" });
  };

  window.kickMember = async function (id, reason) {
    const { error } = await rpc("hifz_kick_member", { target: id, reason: reason || null });
    if (error) throw error;
    await loadChatData();
    renderChat();
    toast("Участник исключён", { type: "info" });
    Sound.play("undo");
  };

  window.unbanMember = async function (id) {
    const { error } = await rpc("hifz_unban_member", { target: id });
    if (error) throw error;
    await loadChatData();
    renderChat();
    toast("Доступ возвращён — участник сможет войти снова");
  };

  window.subscribeCloud = function () {
    unsubscribeCloud();
    if (!client || !member) return;
    try {
      if (isStaff()) {
        channel = client.channel("hifz-workspace")
          .on("postgres_changes", { event: "UPDATE", schema: "public", table: "hifz_workspace", filter: "id=eq.1" }, (p) => {
            if (p.new?.rev > sync.rev && !sync.dirty) pullState().catch(() => {});
          }).subscribe();

        chatChannel = client.channel("hifz-chat")
          .on("postgres_changes", { event: "*", schema: "public", table: "hifz_messages" }, () => {
            loadChatData().then(() => {
              if (ui.view === "chat") renderChat();
            }).catch(() => {});
          }).subscribe();
      }

      reqChannel = client.channel("hifz-requests")
        .on("postgres_changes", { event: "*", schema: "public", table: "hifz_requests" }, () => loadRequests().then(renderAll).catch(() => {}))
        .subscribe();

      memberWatch = client.channel("hifz-member-watch")
        .on("postgres_changes", { event: "DELETE", schema: "public", table: "hifz_members", filter: "user_id=eq." + member.user_id }, () => {
          toast("Вас исключили из журнала", { type: "danger", duration: 8000 });
          setTimeout(() => client.auth.signOut(), 1200);
        }).subscribe();
    } catch (e) {}
  };

  window.unsubscribeCloud = function () {
    if (channel) { try { client.removeChannel(channel); } catch (e) {} channel = null; }
    if (reqChannel) { try { client.removeChannel(reqChannel); } catch (e) {} reqChannel = null; }
    if (chatChannel) { try { client.removeChannel(chatChannel); } catch (e) {} chatChannel = null; }
    if (memberWatch) { try { client.removeChannel(memberWatch); } catch (e) {} memberWatch = null; }
  };

  document.addEventListener("click", async function (e) {
    const t = e.target.closest("[data-action]");
    if (!t) return;
    const a = t.dataset.action;
    const id = t.dataset.id;
    if (a !== "chat-refresh" && a !== "chat-delete" && a !== "kick-member" && a !== "unban-member") return;
    e.preventDefault();
    e.stopPropagation();
    try {
      if (a === "chat-refresh") { await loadChatData(); renderChat(); }
      if (a === "chat-delete") await deleteChatMessage(id);
      if (a === "kick-member") openKickModal(id);
      if (a === "unban-member") await unbanMember(id);
    } catch (err) {
      toast(humanError(err), { type: "danger" });
      Sound.play("err");
    }
  }, true);

  document.addEventListener("submit", async function (e) {
    const f = e.target;
    if (f.id === "chatForm") {
      e.preventDefault();
      e.stopPropagation();
      const val = f.elements.body.value;
      f.elements.body.value = "";
      try { await sendChat(val); } catch (err) { toast(humanError(err), { type: "danger" }); }
      document.querySelector("#chatForm input")?.focus();
    }
    if (f.id === "kickForm") {
      e.preventDefault();
      e.stopPropagation();
      const reason = f.elements.reason.value.trim();
      const target = f.dataset.id;
      closeModal();
      try { await kickMember(target, reason); } catch (err) { toast(humanError(err), { type: "danger" }); }
    }
  }, true);

  if (typeof member !== "undefined" && member && typeof subscribeCloud === "function") {
    subscribeCloud();
  }
  if (typeof ui !== "undefined" && ui.view === "chat") {
    loadChatData().then(() => { if (typeof renderAll === "function") renderAll(); }).catch(() => {});
  }
})();
</script>
<script>
/* ==========================================================
   HIFZ CHAT UNREAD BADGE
   Вставь ПОСЛЕ хотфикса чата и ПЕРЕД </body>.
   Считает непрочитанные сообщения и показывает цифру на вкладке «Чат».
   ========================================================== */
(function () {
  if (window.__hifzUnreadInstalled) return;
  window.__hifzUnreadInstalled = true;

  var BASE_TITLE = (document.title || "Журнал хифза").replace(/^\(\d+\+?\)\s*/, "");
  var lastFocusLoad = 0;

  function mem() { try { return typeof member !== "undefined" ? member : null; } catch (e) { return null; } }
  function view() { try { return typeof ui !== "undefined" ? ui.view : ""; } catch (e) { return ""; } }
  function staff() { try { return typeof isStaff === "function" && isStaff(); } catch (e) { return false; } }
  function list() {
    try { return (typeof chatMessages !== "undefined" && Array.isArray(chatMessages)) ? chatMessages : []; }
    catch (e) { return []; }
  }
  function readKey() { var m = mem(); return "hifz-chat-read-" + (m && m.user_id ? m.user_id : "anon"); }

  function getLastRead() {
    try { return Number(localStorage.getItem(readKey()) || 0); } catch (e) { return 0; }
  }
  function setLastRead(ts) {
    try { localStorage.setItem(readKey(), String(ts)); } catch (e) {}
  }

  function countUnread() {
    var m = mem();
    if (!staff() || !m) return 0;
    var last = getLastRead();
    var n = 0;
    var arr = list();
    for (var i = 0; i < arr.length; i++) {
      var msg = arr[i];
      if (msg.user_id === m.user_id) continue;
      if (new Date(msg.created_at).getTime() > last) n++;
    }
    return n;
  }

  function paint() {
    var tab = document.querySelector('#tabs [data-action="nav"][data-view="chat"]');
    if (!tab) return;
    var n = window.__hifzUnread || 0;
    var b = tab.querySelector(".chat-badge");
    if (!n) {
      if (b) b.remove();
      tab.classList.remove("has-unread");
      return;
    }
    if (!b) {
      b = document.createElement("span");
      b.className = "tab-badge chat-badge";
      tab.appendChild(b);
    }
    tab.classList.add("has-unread");
    var text = n > 99 ? "99+" : String(n);
    if (b.textContent !== text) {
      b.textContent = text;
      b.classList.remove("pop");
      void b.offsetWidth;
      b.classList.add("pop");
    }
  }

  function title() {
    var n = window.__hifzUnread || 0;
    document.title = n ? "(" + (n > 99 ? "99+" : n) + ") " + BASE_TITLE : BASE_TITLE;
  }

  function markRead() {
    var ts = Date.now();
    var arr = list();
    for (var i = 0; i < arr.length; i++) {
      var t = new Date(arr[i].created_at).getTime();
      if (t > ts) ts = t;
    }
    setLastRead(ts);
    window.__hifzUnread = 0;
    paint();
    title();
  }

  function ping() {
    try {
      if (typeof prefs !== "undefined" && !prefs.sound) return;
      if (typeof Sound === "undefined") return;
      Sound.ensure();
      if (!Sound.ctx) return;
      var t = Sound.ctx.currentTime;
      Sound.tone(880, t, 0.09, 0.04);
      Sound.tone(1174.7, t + 0.075, 0.13, 0.035);
    } catch (e) {}
  }

  function refresh(notify) {
    var prev = window.__hifzUnread || 0;
    if (view() === "chat") { markRead(); return; }
    var n = countUnread();
    window.__hifzUnread = n;
    paint();
    title();
    if (notify && n > prev) ping();
  }

  /* --- оборачиваем существующие функции --- */

  if (typeof window.renderHeader === "function") {
    var _renderHeader = window.renderHeader;
    window.renderHeader = function () {
      var r = _renderHeader.apply(this, arguments);
      paint();
      return r;
    };
  }

  if (typeof window.renderView === "function") {
    var _renderView = window.renderView;
    window.renderView = function () {
      var r = _renderView.apply(this, arguments);
      if (view() === "chat") markRead();
      return r;
    };
  }

  if (typeof window.go === "function") {
    var _go = window.go;
    window.go = function (v, id) {
      var r = _go.apply(this, arguments);
      if (v === "chat") setTimeout(markRead, 60);
      return r;
    };
  }

  if (typeof window.loadChatData === "function") {
    var _loadChatData = window.loadChatData;
    window.loadChatData = async function () {
      var r = await _loadChatData.apply(this, arguments);
      refresh(true);
      return r;
    };
  }

  /* --- запасной опрос при возврате на вкладку --- */
  window.addEventListener("focus", function () {
    if (view() === "chat") { markRead(); return; }
    var now = Date.now();
    if (now - lastFocusLoad < 5000) { refresh(false); return; }
    lastFocusLoad = now;
    if (staff() && typeof window.loadChatData === "function") {
      window.loadChatData().catch(function () {});
    } else {
      refresh(false);
    }
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && view() === "chat") markRead();
  });

  /* --- стили бейджа --- */
  if (!document.getElementById("hifz-unread-css")) {
    var st = document.createElement("style");
    st.id = "hifz-unread-css";
    st.textContent = [
      '.tab-badge.chat-badge{',
      '  background:linear-gradient(135deg,var(--violet),var(--blue));',
      '  color:#fff;box-shadow:0 2px 10px rgba(106,90,224,.5);',
      '  min-width:19px;height:19px;padding:0 6px;font-size:10.5px;',
      '}',
      '.tab-badge.chat-badge.pop{animation:chatBadgePop .5s cubic-bezier(.2,.7,.3,1.5)}',
      '@keyframes chatBadgePop{0%{transform:scale(.3)}55%{transform:scale(1.3)}100%{transform:scale(1)}}',
      '.tab.has-unread{color:var(--ink);font-weight:800}',
      '[data-theme="dark"] .tab.has-unread{color:var(--blue3)}'
    ].join("\n");
    document.head.appendChild(st);
  }

  window.__hifzUnread = countUnread();
  paint();
  title();
  setTimeout(function () { refresh(false); }, 1200);
})();
</script>
<script>
/* ==========================================================
   HIFZ CHAT PLUS
   Вставь ПОСЛЕ всех предыдущих чат-хотфиксов и ПЕРЕД </body>.
   Группы, личные сообщения, фото.
   ========================================================== */
(function () {
  if (window.__hifzChatPlus) return;
  window.__hifzChatPlus = true;

  var S = {
    conversations: [],
    messages: [],
    active: null,
    members: [],
    uploading: false
  };

  var cvMsgChannel = null;
  var cvMemberChannel = null;
  var cvConvChannel = null;
  var BASE_TITLE = (document.title || "Журнал хифза").replace(/^\(\d+\+?\)\s*/, "");

  function safeStaff() {
    try { return typeof isStaff === "function" && isStaff(); } catch (e) { return false; }
  }

  function convName(c) {
    if (!c) return "Чат";
    if (c.is_general) return "Общий чат";
    if (c.kind === "direct") {
      var other = (c.members || []).find(function (m) { return member && m.user_id !== member.user_id; });
      return other ? other.name : "Личный чат";
    }
    return c.name || "Группа";
  }

  function convInitials(c) {
    return initials(convName(c));
  }

  function convPreview(c) {
    var lm = c.last_message;
    if (!lm) return "Нет сообщений";
    if (lm.image_url) return "📷 Фото";
    return lm.body || "";
  }

  function totalUnread() {
    return S.conversations.reduce(function (a, c) {
      if (c.id === S.active) return a;
      return a + Number(c.unread || 0);
    }, 0);
  }

  function paintBadge() {
    var tab = document.querySelector('#tabs [data-action="nav"][data-view="chat"]');
    if (!tab) return;
    var n = totalUnread();
    var b = tab.querySelector(".chat-badge");
    if (!n) {
      if (b) b.remove();
      tab.classList.remove("has-unread");
      return;
    }
    if (!b) {
      b = document.createElement("span");
      b.className = "tab-badge chat-badge";
      tab.appendChild(b);
    }
    tab.classList.add("has-unread");
    b.textContent = n > 99 ? "99+" : String(n);
  }

  function refreshBadge() {
    window.__hifzUnread = totalUnread();
    if (typeof renderHeader === "function") renderHeader();
    paintBadge();
    var n = totalUnread();
    document.title = n ? "(" + (n > 99 ? "99+" : n) + ") " + BASE_TITLE : BASE_TITLE;
  }

  async function fetchConversations() {
    var res = await rpc("hifz_list_conversations");
    if (res.error) throw res.error;
    S.conversations = res.data || [];
  }

  async function fetchMessages(id) {
    var res = await rpc("hifz_get_conversation_messages", { p_conversation: id, p_limit: 200 });
    if (res.error) throw res.error;
    S.messages = res.data || [];
  }

  async function markRead(id) {
    if (!id) return;
    await rpc("hifz_mark_conversation_read", { p_conversation: id });
    var c = S.conversations.find(function (x) { return x.id === id; });
    if (c) c.unread = 0;
    refreshBadge();
  }

  window.loadChatData = async function () {
    if (!safeStaff()) return;

    await rpc("hifz_ensure_general_conversation");

    var memRes = await client.from("hifz_members").select("*").order("created_at");
    if (memRes.error) throw memRes.error;
    S.members = memRes.data || [];

    await fetchConversations();

    if (!S.active || !S.conversations.some(function (c) { return c.id === S.active; })) {
      var general = S.conversations.find(function (c) { return c.is_general; }) || S.conversations[0];
      S.active = general ? general.id : null;
    }

    if (S.active) {
      await fetchMessages(S.active);
      await markRead(S.active);
    } else {
      S.messages = [];
    }

    refreshBadge();
  };

  function renderConversationList() {
    var wrap = $("#cvConversations");
    if (!wrap) return;

    if (!S.conversations.length) {
      wrap.innerHTML = '<div class="empty-list" style="padding:18px">Диалогов пока нет.</div>';
      return;
    }

    wrap.innerHTML = S.conversations.map(function (c) {
      var active = c.id === S.active;
      var unread = Number(c.unread || 0);
      return '<button class="cv-item ' + (active ? "active" : "") + '" data-action="cv-select" data-id="' + c.id + '">' +
        '<span class="avatar sm">' + esc(convInitials(c)) + '</span>' +
        '<span class="cv-item-main">' +
          '<b>' + esc(convName(c)) + '</b>' +
          '<small>' + esc(convPreview(c)).slice(0, 60) + '</small>' +
        '</span>' +
        (unread ? '<span class="cv-unread">' + (unread > 99 ? "99+" : unread) + '</span>' : "") +
      '</button>';
    }).join("");
  }

  function messageHTML(m) {
    var mine = member && m.user_id === member.user_id;
    var canDelete = mine || (typeof isOwner === "function" && isOwner());
    var body = m.body ? '<p>' + esc(m.body).replace(/\n/g, "<br>") + '</p>' : "";
    var image = m.image_url
      ? '<img class="cv-photo" src="' + esc(m.image_url) + '" alt="Фото" loading="lazy" data-action="cv-open-image" data-url="' + esc(m.image_url) + '">'
      : "";

    return '<article class="chat-msg ' + (mine ? "mine" : "") + '" data-cv-mid="' + m.id + '">' +
      '<span class="avatar sm">' + esc(initials(m.author_name)) + '</span>' +
      '<div class="chat-bubble">' +
        '<header>' +
          '<b>' + esc(m.author_name) + '</b>' +
          (typeof roleBadge === "function" ? roleBadge(m.author_role) : "") +
          '<time>' + chatTime(m.created_at) + '</time>' +
          (canDelete ? '<button class="chat-del" data-action="cv-delete-message" data-id="' + m.id + '" title="Удалить">' + icon("trash", 12) + '</button>' : "") +
        '</header>' +
        image +
        body +
      '</div>' +
    '</article>';
  }

  function renderMessages() {
    var wrap = $("#cvMessages");
    if (!wrap) return;

    if (!S.active) {
      wrap.innerHTML = '<div class="chat-empty">' + icon("chat", 30) + '<p>Выбери диалог слева.</p></div>';
      return;
    }

    if (!S.messages.length) {
      wrap.innerHTML = '<div class="chat-empty">' + icon("chat", 30) + '<p>Сообщений пока нет.<br>Напиши первым или отправь фото.</p></div>';
      return;
    }

    wrap.innerHTML = S.messages.map(messageHTML).join("");
    wrap.scrollTop = wrap.scrollHeight;
  }

  function renderRoomHead() {
    var head = $("#cvRoomHead");
    if (!head) return;
    var c = S.conversations.find(function (x) { return x.id === S.active; });
    if (!c) {
      head.innerHTML = "<b>Чат</b>";
      return;
    }

    var canDeleteGroup = c.kind === "group" && !c.is_general &&
      (isOwner() || c.created_by === member.user_id);

    head.innerHTML =
      '<div class="cv-room-title">' +
        '<span class="avatar sm">' + esc(convInitials(c)) + '</span>' +
        '<div><b>' + esc(convName(c)) + '</b>' +
        '<small>' + (c.kind === "direct" ? "Личный диалог" : (c.members || []).length + " участников") + '</small></div>' +
      '</div>' +
      (canDeleteGroup ? '<button class="icon-btn" data-action="cv-delete-group" data-id="' + c.id + '" title="Удалить группу">' + icon("trash", 14) + '</button>' : "");
  }

  window.renderChat = function () {
    renderConversationList();
    renderRoomHead();
    renderMessages();
  };

  window.viewChat = function () {
    if (!safeStaff()) return emptyBlock("Только для команды", "Чат доступен владельцу и учителям.");

    return '<div class="page-head reveal">' +
        '<div><h1>Чат команды</h1><p class="sub">Группы, личные сообщения и фото</p></div>' +
        '<div class="cv-head-actions">' +
          '<button class="btn soft" data-action="cv-new-direct">' + icon("mail", 15) + ' Личное</button>' +
          '<button class="btn primary" data-action="cv-new-group">' + icon("plus", 15) + ' Группа</button>' +
          '<button class="btn ghost" data-action="cv-refresh">' + icon("refresh", 15) + '</button>' +
        '</div>' +
      '</div>' +
      '<div class="cv-grid">' +
        '<aside class="card cv-side reveal" style="--i:1">' +
          '<div class="cv-side-head"><b>Диалоги</b><span>' + S.conversations.length + '</span></div>' +
          '<div id="cvConversations" class="cv-list"></div>' +
        '</aside>' +
        '<section class="card cv-room reveal" style="--i:2">' +
          '<header id="cvRoomHead" class="cv-room-head"></header>' +
          '<div id="cvMessages" class="chat-messages cv-messages"></div>' +
          '<form id="cvForm" class="chat-form cv-form">' +
            '<input type="file" id="cvFile" accept="image/png,image/jpeg,image/webp,image/gif" hidden>' +
            '<button type="button" class="btn ghost cv-attach" data-action="cv-photo" title="Отправить фото">' + icon("upload", 16) + '</button>' +
            '<input name="body" id="cvBody" maxlength="2000" placeholder="Сообщение или подпись к фото…" autocomplete="off">' +
            '<button class="btn primary" type="submit" title="Отправить">' + icon("send", 15) + '</button>' +
          '</form>' +
        '</section>' +
      '</div>';
  };

  function openGroupModal() {
    var staff = S.members.filter(function (m) {
      return (m.role === "owner" || m.role === "teacher") && member && m.user_id !== member.user_id;
    });

    openModal(
      '<h3>Новая группа</h3>' +
      '<form id="cvGroupForm">' +
        '<label class="field">Название<input name="name" required maxlength="60" placeholder="Например: Утренняя группа"></label>' +
        '<div class="field"><span>Участники</span>' +
          '<div class="cv-checks">' +
            (staff.length
              ? staff.map(function (m) {
                  return '<label class="cv-check">' +
                    '<input type="checkbox" name="user" value="' + m.user_id + '">' +
                    '<span class="avatar sm">' + esc(initials(m.name || m.email)) + '</span>' +
                    '<span><b>' + esc(m.name || m.email || "Участник") + '</b><small>' + roleLabel(m.role) + '</small></span>' +
                  '</label>';
                }).join("")
              : '<div class="empty-list" style="padding:12px">Нет других учителей.</div>') +
          '</div>' +
        '</div>' +
        '<div class="modal-actions">' +
          '<button type="button" class="btn ghost" data-action="modal-close">Отмена</button>' +
          '<button class="btn primary" type="submit">' + icon("plus", 14) + ' Создать</button>' +
        '</div>' +
      '</form>'
    );
  }

  function openDirectModal() {
    var staff = S.members.filter(function (m) {
      return (m.role === "owner" || m.role === "teacher") && member && m.user_id !== member.user_id;
    });

    openModal(
      '<h3>Личное сообщение</h3>' +
      '<p>Выбери, кому написать.</p>' +
      '<div class="cv-direct-list">' +
        (staff.length
          ? staff.map(function (m) {
              return '<button class="cv-direct-item" data-action="cv-start-direct" data-id="' + m.user_id + '">' +
                '<span class="avatar sm">' + esc(initials(m.name || m.email)) + '</span>' +
                '<span><b>' + esc(m.name || m.email || "Участник") + '</b><small>' + roleLabel(m.role) + '</small></span>' +
              '</button>';
            }).join("")
          : '<div class="empty-list" style="padding:12px">Нет других учителей.</div>') +
      '</div>' +
      '<div class="modal-actions"><button class="btn ghost" data-action="modal-close">Закрыть</button></div>'
    );
  }

  async function startDirect(userId) {
    var res = await rpc("hifz_create_conversation", {
      p_kind: "direct",
      p_name: null,
      p_user_ids: [userId]
    });
    if (res.error) throw res.error;
    closeModal();
    S.active = res.data;
    await window.loadChatData();
    renderAll();
    toast("Личный диалог открыт");
  }

  async function sendText() {
    var input = $("#cvBody");
    var text = input ? input.value.trim() : "";
    if (!text || !S.active) return;
    input.value = "";

    var res = await rpc("hifz_send_conversation_message", {
      p_conversation: S.active,
      p_body: text,
      p_image_url: null
    });
    if (res.error) throw res.error;

    if (res.data && !S.messages.some(function (m) { return m.id === res.data.id; })) {
      S.messages.push(res.data);
    }

    await fetchConversations();
    await markRead(S.active);
    window.renderChat();
    Sound.play("save");
  }

  async function sendPhoto(file) {
    if (!file || !S.active || S.uploading) return;

    if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) {
      toast("Можно отправлять PNG, JPG, WEBP или GIF", { type: "danger" });
      return;
    }

    if (file.size > 10 * 1024 * 1024) {
      toast("Фото слишком большое. Максимум 10 МБ", { type: "danger" });
      return;
    }

    S.uploading = true;
    toast("Загружаем фото…", { type: "info", duration: 2500 });

    try {
      var ext = (file.name.split(".").pop() || "jpg").toLowerCase();
      var path = S.active + "/" + member.user_id + "/" + Date.now() + "-" + Math.random().toString(36).slice(2) + "." + ext;

      var up = await client.storage.from("hifz-chat").upload(path, file, {
        cacheControl: "3600",
        contentType: file.type,
        upsert: false
      });
      if (up.error) throw up.error;

      var pub = client.storage.from("hifz-chat").getPublicUrl(path);
      var caption = $("#cvBody") ? $("#cvBody").value.trim() : "";
      if ($("#cvBody")) $("#cvBody").value = "";

      var res = await rpc("hifz_send_conversation_message", {
        p_conversation: S.active,
        p_body: caption || null,
        p_image_url: pub.data.publicUrl
      });
      if (res.error) throw res.error;

      if (res.data && !S.messages.some(function (m) { return m.id === res.data.id; })) {
        S.messages.push(res.data);
      }

      await fetchConversations();
      await markRead(S.active);
      window.renderChat();
      Sound.play("save");
    } finally {
      S.uploading = false;
    }
  }

  async function deleteMessage(id) {
    var res = await rpc("hifz_delete_conversation_message", { p_id: id });
    if (res.error) throw res.error;
    S.messages = S.messages.filter(function (m) { return m.id !== id; });
    await fetchConversations();
    window.renderChat();
    toast("Сообщение удалено", { type: "info" });
  }

  async function deleteGroup(id) {
    var res = await rpc("hifz_delete_conversation", { p_id: id });
    if (res.error) throw res.error;
    S.active = null;
    await window.loadChatData();
    renderAll();
    toast("Группа удалена", { type: "info" });
  }

  function ping() {
    try {
      if (typeof prefs !== "undefined" && !prefs.sound) return;
      if (typeof Sound === "undefined") return;
      Sound.ensure();
      if (!Sound.ctx) return;
      var t = Sound.ctx.currentTime;
      Sound.tone(880, t, 0.09, 0.04);
      Sound.tone(1174.7, t + 0.075, 0.13, 0.035);
    } catch (e) {}
  }

  async function onRealtimeMessage(msg) {
    if (!msg || !member) return;

    if (msg.conversation_id === S.active) {
      if (!S.messages.some(function (m) { return m.id === msg.id; })) {
        S.messages.push(msg);
        S.messages.sort(function (a, b) { return new Date(a.created_at) - new Date(b.created_at); });
        renderMessages();
      }
      await markRead(S.active);
    }

    await fetchConversations();
    renderConversationList();
    refreshBadge();

    if (msg.user_id !== member.user_id && msg.conversation_id !== S.active) {
      ping();
    }
  }

  var _subscribeCloud = window.subscribeCloud;
  var _unsubscribeCloud = window.unsubscribeCloud;

  window.unsubscribeCloud = function () {
    if (cvMsgChannel) { try { client.removeChannel(cvMsgChannel); } catch (e) {} cvMsgChannel = null; }
    if (cvMemberChannel) { try { client.removeChannel(cvMemberChannel); } catch (e) {} cvMemberChannel = null; }
    if (cvConvChannel) { try { client.removeChannel(cvConvChannel); } catch (e) {} cvConvChannel = null; }
    if (typeof _unsubscribeCloud === "function") _unsubscribeCloud.apply(this, arguments);
  };

  window.subscribeCloud = function () {
    if (typeof _subscribeCloud === "function") _subscribeCloud.apply(this, arguments);
    if (!client || !member || !safeStaff()) return;

    try {
      cvMsgChannel = client.channel("cv-messages")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "hifz_chat_messages" }, function (p) {
          onRealtimeMessage(p.new).catch(function () {});
        })
        .subscribe();

      cvMemberChannel = client.channel("cv-members")
        .on("postgres_changes", { event: "*", schema: "public", table: "hifz_conversation_members" }, function () {
          window.loadChatData().then(function () {
            if (ui.view === "chat") window.renderChat();
          }).catch(function () {});
        })
        .subscribe();

      cvConvChannel = client.channel("cv-conversations")
        .on("postgres_changes", { event: "*", schema: "public", table: "hifz_conversations" }, function () {
          fetchConversations().then(function () {
            renderConversationList();
            refreshBadge();
          }).catch(function () {});
        })
        .subscribe();
    } catch (e) {}
  };

  document.addEventListener("click", async function (e) {
    var t = e.target.closest("[data-action]");
    if (!t) return;
    var a = t.dataset.action;
    var id = t.dataset.id;

    if (a === "cv-select") {
      e.preventDefault(); e.stopPropagation();
      try {
        S.active = id;
        await fetchMessages(id);
        await markRead(id);
        window.renderChat();
      } catch (err) { toast(humanError(err), { type: "danger" }); }
      return;
    }

    if (a === "cv-refresh") {
      e.preventDefault(); e.stopPropagation();
      try { await window.loadChatData(); window.renderChat(); } catch (err) { toast(humanError(err), { type: "danger" }); }
      return;
    }

    if (a === "cv-new-group") {
      e.preventDefault(); e.stopPropagation();
      openGroupModal();
      return;
    }

    if (a === "cv-new-direct") {
      e.preventDefault(); e.stopPropagation();
      openDirectModal();
      return;
    }

    if (a === "cv-start-direct") {
      e.preventDefault(); e.stopPropagation();
      try { await startDirect(id); } catch (err) { toast(humanError(err), { type: "danger" }); }
      return;
    }

    if (a === "cv-photo") {
      e.preventDefault(); e.stopPropagation();
      var file = $("#cvFile");
      if (file) file.click();
      return;
    }

    if (a === "cv-open-image") {
      e.preventDefault(); e.stopPropagation();
      var url = t.dataset.url;
      openModal('<div class="cv-lightbox"><img src="' + esc(url) + '" alt="Фото"><div class="modal-actions"><a class="btn soft" href="' + esc(url) + '" target="_blank" rel="noopener">Открыть оригинал</a><button class="btn ghost" data-action="modal-close">Закрыть</button></div></div>');
      return;
    }

    if (a === "cv-delete-message") {
      e.preventDefault(); e.stopPropagation();
      try { await deleteMessage(id); } catch (err) { toast(humanError(err), { type: "danger" }); }
      return;
    }

    if (a === "cv-delete-group") {
      e.preventDefault(); e.stopPropagation();
      openModal('<h3>Удалить группу?</h3><p>Все сообщения группы будут удалены.</p><div class="modal-actions"><button class="btn ghost" data-action="modal-close">Отмена</button><button class="btn danger" data-action="cv-confirm-delete-group" data-id="' + id + '">Удалить</button></div>');
      return;
    }

    if (a === "cv-confirm-delete-group") {
      e.preventDefault(); e.stopPropagation();
      closeModal();
      try { await deleteGroup(id); } catch (err) { toast(humanError(err), { type: "danger" }); }
      return;
    }
  }, true);

  document.addEventListener("submit", async function (e) {
    var f = e.target;

    if (f.id === "cvForm") {
      e.preventDefault(); e.stopPropagation();
      try { await sendText(); } catch (err) { toast(humanError(err), { type: "danger" }); }
      return;
    }

    if (f.id === "cvGroupForm") {
      e.preventDefault(); e.stopPropagation();
      try {
        var name = f.elements.name.value.trim();
        var ids = Array.from(f.querySelectorAll('input[name="user"]:checked')).map(function (i) { return i.value; });
        if (!name) return;
        if (!ids.length) { toast("Выбери хотя бы одного участника", { type: "danger" }); return; }

        var res = await rpc("hifz_create_conversation", {
          p_kind: "group",
          p_name: name,
          p_user_ids: ids
        });
        if (res.error) throw res.error;

        closeModal();
        S.active = res.data;
        await window.loadChatData();
        renderAll();
        toast("Группа создана");
        Sound.play("save");
      } catch (err) { toast(humanError(err), { type: "danger" }); }
      return;
    }
  }, true);

  document.addEventListener("change", async function (e) {
    if (e.target.id === "cvFile") {
      var file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (file) {
        try { await sendPhoto(file); } catch (err) { toast(humanError(err), { type: "danger" }); }
      }
    }
  }, true);

  if (!document.getElementById("hifz-chat-plus-css")) {
    var st = document.createElement("style");
    st.id = "hifz-chat-plus-css";
    st.textContent = [
      ".cv-head-actions{display:flex;gap:8px;flex-wrap:wrap}",
      ".cv-grid{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}",
      ".cv-side{padding:0;overflow:hidden;position:sticky;top:82px}",
      ".cv-side-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface2)}",
      ".cv-side-head b{font-size:13px;font-weight:800}",
      ".cv-side-head span{font-size:11px;font-weight:800;color:var(--muted);background:var(--surface3);padding:2px 8px;border-radius:9px}",
      ".cv-list{max-height:min(620px,calc(100vh - 240px));overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:5px}",
      ".cv-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;cursor:pointer;padding:9px;border-radius:12px;text-align:left;transition:.15s}",
      ".cv-item:hover{background:var(--surface2)}",
      ".cv-item.active{background:var(--blue-soft)}",
      ".cv-item-main{flex:1;min-width:0}",
      ".cv-item-main b{display:block;font-size:12.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}",
      ".cv-item-main small{display:block;font-size:11px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}",
      ".cv-unread{min-width:19px;height:19px;padding:0 6px;border-radius:10px;background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;flex:none}",
      ".cv-room{padding:0;overflow:hidden;display:flex;flex-direction:column;height:min(680px,calc(100vh - 220px))}",
      ".cv-room-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--surface2)}",
      ".cv-room-title{display:flex;align-items:center;gap:10px;min-width:0}",
      ".cv-room-title b{display:block;font-size:13.5px;font-weight:800}",
      ".cv-room-title small{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:1px}",
      ".cv-messages{flex:1}",
      ".cv-form{align-items:center}",
      ".cv-attach{width:42px;padding:0;flex:none}",
      ".cv-photo{display:block;max-width:min(320px,100%);max-height:320px;object-fit:cover;border-radius:11px;margin:6px 0;cursor:zoom-in;border:1px solid var(--line)}",
      ".cv-checks{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto}",
      ".cv-check{display:flex;align-items:center;gap:10px;padding:8px;border-radius:11px;background:var(--surface2);cursor:pointer}",
      ".cv-check input{width:17px;height:17px;min-height:0;accent-color:var(--blue);flex:none}",
      ".cv-check b{display:block;font-size:12.5px;font-weight:800;color:var(--ink)}",
      ".cv-check small{display:block;font-size:11px;color:var(--muted);font-weight:600}",
      ".cv-direct-list{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto}",
      ".cv-direct-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--surface2);cursor:pointer;padding:10px;border-radius:12px;text-align:left;transition:.15s}",
      ".cv-direct-item:hover{background:var(--blue-soft)}",
      ".cv-direct-item b{display:block;font-size:13px;font-weight:800}",
      ".cv-direct-item small{display:block;font-size:11px;color:var(--muted);font-weight:600}",
      ".cv-lightbox img{display:block;max-width:100%;max-height:70vh;object-fit:contain;border-radius:12px;margin:0 auto 14px}",
      "@media(max-width:1000px){.cv-grid{grid-template-columns:1fr}.cv-side{position:static}.cv-list{max-height:220px}.cv-room{height:min(560px,70vh)}}"
    ].join("\n");
    document.head.appendChild(st);
  }

  var _renderView = window.renderView;
  window.renderView = function () {
    var r = _renderView.apply(this, arguments);
    if (typeof ui !== "undefined" && ui.view === "chat") {
      setTimeout(function () { refreshBadge(); }, 60);
    }
    return r;
  };

  var _go = window.go;
  window.go = function (v, id) {
    var r = _go.apply(this, arguments);
    if (v === "chat") {
      setTimeout(function () {
        markRead(S.active).catch(function () {});
        refreshBadge();
      }, 120);
    }
    return r;
  };

  window.addEventListener("focus", function () {
    if (safeStaff()) {
      setTimeout(function () {
        fetchConversations().then(function () {
          renderConversationList();
          refreshBadge();
        }).catch(function () {});
      }, 300);
    }
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && typeof ui !== "undefined" && ui.view === "chat") {
      setTimeout(function () {
        markRead(S.active).catch(function () {});
        refreshBadge();
      }, 120);
    }
  });

  if (typeof member !== "undefined" && member && safeStaff()) {
    window.subscribeCloud();
    if (typeof ui !== "undefined" && ui.view === "chat") {
      window.loadChatData().then(function () { renderAll(); }).catch(function () {});
    }
  }
})();
</script>
<script>
/* ==========================================================
   HIFZ CHAT PRESENCE
   Вставь ПОСЛЕ всех предыдущих чат-хотфиксов и ПЕРЕД </body>.
   Показывает онлайн-точки, «в сети / 5 мин назад» и панель команды.
   ========================================================== */
(function () {
  if (window.__hifzPresence) return;
  window.__hifzPresence = true;

  var ONLINE_MS = 120000;
  var BEAT_MS = 45000;
  var CONV_MS = 60000;

  var P = { members: {}, convs: [] };
  var lastBeat = 0;
  var lastConv = 0;
  var presChannel = null;
  var presConvChannel = null;
  var ticker = null;

  function me() { try { return typeof member !== "undefined" ? member : null; } catch (e) { return null; } }
  function view() { try { return typeof ui !== "undefined" ? ui.view : ""; } catch (e) { return ""; } }
  function staff() { try { return typeof isStaff === "function" && isStaff(); } catch (e) { return false; } }

  function seenOf(uid) {
    var m = P.members[uid];
    return m && m.last_seen_at ? m.last_seen_at : null;
  }

  function isOnline(ts) {
    if (!ts) return false;
    var diff = Date.now() - new Date(ts).getTime();
    return diff >= -30000 && diff < ONLINE_MS;
  }

  function fmtSeen(ts) {
    if (!ts) return "ещё не заходил";
    var d = new Date(ts);
    var diff = Date.now() - d.getTime();
    if (diff < 0) diff = 0;
    if (diff < ONLINE_MS) return "в сети";

    var min = Math.floor(diff / 60000);
    if (min < 60) return min + " мин назад";

    var day = dstr(d);
    var t = today();
    var hm = fmtTime.format(d);

    if (day === t) return "сегодня в " + hm;
    if (day === addD(t, -1)) return "вчера в " + hm;
    return fmtDay.format(d) + " в " + hm;
  }

  function fullStamp(ts) {
    if (!ts) return "Визитов пока не было";
    var d = new Date(ts);
    return fmtDay.format(d) + " · " + fmtTime.format(d);
  }

  async function touch() {
    var m = me();
    if (!m || !staff()) return;
    lastBeat = Date.now();
    try {
      await rpc("hifz_touch_presence");
      if (P.members[m.user_id]) P.members[m.user_id].last_seen_at = new Date().toISOString();
      decorate();
    } catch (e) {}
  }

  async function loadMembers() {
    if (!staff()) return;
    try {
      var res = await client.from("hifz_members").select("*");
      if (res.error) return;
      var map = {};
      (res.data || []).forEach(function (x) { map[x.user_id] = x; });
      P.members = map;
    } catch (e) {}
  }

  async function loadConvs() {
    if (!staff()) return;
    lastConv = Date.now();
    try {
      var res = await rpc("hifz_list_conversations");
      if (!res.error) P.convs = res.data || [];
    } catch (e) {}
  }

  function ensureDot(host, online) {
    if (!host) return;
    var dot = host.querySelector(".cv-dot");
    if (!dot) {
      dot = document.createElement("i");
      dot.className = "cv-dot";
      host.appendChild(dot);
    }
    dot.className = "cv-dot " + (online ? "on" : "off");
  }

  function otherOf(c) {
    var m = me();
    if (!c || !m) return null;
    return (c.members || []).find(function (x) { return x.user_id !== m.user_id; }) || null;
  }

  function decorate() {
    var m = me();
    if (!m || !staff()) return;

    var side = document.querySelector(".cv-side") || document.querySelector(".chat-side");
    if (!side) return;

    /* точки на диалогах */
    document.querySelectorAll(".cv-item[data-id]").forEach(function (el) {
      var c = P.convs.find(function (x) { return x.id === el.dataset.id; });
      if (!c) return;
      var online = false;
      if (c.kind === "direct") {
        var o = otherOf(c);
        online = o ? isOnline(seenOf(o.user_id)) : false;
      } else {
        online = (c.members || []).some(function (x) {
          return x.user_id !== m.user_id && isOnline(seenOf(x.user_id));
        });
      }
      ensureDot(el.querySelector(".avatar"), online);
    });

    /* статус в шапке диалога */
    var headSmall = document.querySelector("#cvRoomHead .cv-room-title small");
    var activeEl = document.querySelector(".cv-item.active");
    if (headSmall && activeEl) {
      var conv = P.convs.find(function (x) { return x.id === activeEl.dataset.id; });
      if (conv) {
        if (conv.kind === "direct") {
          var oth = otherOf(conv);
          var ts = oth ? seenOf(oth.user_id) : null;
          headSmall.innerHTML =
            '<i class="cv-dot inline ' + (isOnline(ts) ? "on" : "off") + '"></i>' +
            esc(fmtSeen(ts));
          headSmall.title = oth ? fullStamp(ts) : "";
        } else {
          var total = (conv.members || []).length;
          var onl = (conv.members || []).filter(function (x) { return isOnline(seenOf(x.user_id)); }).length;
          headSmall.innerHTML =
            '<i class="cv-dot inline ' + (onl > 1 ? "on" : "off") + '"></i>' +
            onl + " в сети · " + total + " участников";
          headSmall.title = "";
        }
      }
    }

    /* панель команды */
    var panel = document.getElementById("cvPresence");
    if (!panel) {
      panel = document.createElement("div");
      panel.id = "cvPresence";
      panel.className = "cv-presence";
      side.appendChild(panel);
    }

    var team = Object.keys(P.members).map(function (k) { return P.members[k]; })
      .filter(function (x) { return x.role === "owner" || x.role === "teacher"; });

    team.sort(function (a, b) {
      var ao = isOnline(seenOf(a.user_id)) ? 1 : 0;
      var bo = isOnline(seenOf(b.user_id)) ? 1 : 0;
      if (ao !== bo) return bo - ao;
      return new Date(seenOf(b.user_id) || 0) - new Date(seenOf(a.user_id) || 0);
    });

    var onlineCount = team.filter(function (x) { return isOnline(seenOf(x.user_id)); }).length;

    panel.innerHTML =
      '<div class="cv-presence-head"><b>Команда</b><span>' + onlineCount + ' в сети</span></div>' +
      '<div class="cv-presence-list">' +
        (team.length
          ? team.map(function (x) {
              var ts = seenOf(x.user_id);
              var on = isOnline(ts);
              var self = x.user_id === m.user_id;
              return '<div class="cv-presence-row ' + (on ? "online" : "") + '" title="' + esc(fullStamp(ts)) + '">' +
                '<span class="avatar sm">' + esc(initials(x.name || x.email)) + '<i class="cv-dot ' + (on ? "on" : "off") + '"></i></span>' +
                '<span class="cv-presence-main">' +
                  '<b>' + esc(x.name || x.email || "Участник") + (self ? ' <em class="cv-presence-me">вы</em>' : "") + '</b>' +
                  '<small>' + esc(self && on ? "в сети" : fmtSeen(ts)) + '</small>' +
                '</span>' +
              '</div>';
            }).join("")

        title: "Отправить в архив?",
        text: "Ученица пропадёт из списка активных и из «Сегодня», но все данные сохранятся.",
        target: as ? { name: as.name, sub: as.group } : { name: "Ученица", sub: "" },
        note: "Вернуть из архива можно в любой момент.",
        noteIcon: "undo",
        ok: "В архив"
      };
    }

    return {
      tone: "danger", icon: "alert",
      title: "Подтвердите удаление",
      text: "Это действие удалит данные. Продолжить?",
      ok: "Удалить"
    };
  }

  /* ---------- выполнение ---------- */
  async function execute(a, id, el) {
    var S = safeState();
    switch (a) {
      case "delete-student": deleteStudent(id); break;
      case "delete-passage":
        deletePassage(id);
        if (typeof closeDrawer === "function") closeDrawer();
        break;
      case "archive-student": archiveStudent(id); break;
      case "delete-view":
        withUndo("Вид удалён", function () {
          S.views = S.views.filter(function (v) { return v.id !== id; });
        }, "info");
        break;
      case "clear-all":
        withUndo("Все данные очищены", function () {
          S.students = []; S.passages = []; S.events = []; S.views = [];
        }, "info");
        if (typeof go === "function") go("today");
        break;
      case "revoke-invite": {
        var r = await rpc("hifz_revoke_invite", { inv_code: el.dataset.code });
        if (r.error) throw r.error;
        await loadTeam();
        renderAll();
        toast("Приглашение отозвано", { type: "info" });
        break;
      }
      case "reject-request": await rejectRequest(id); break;
      case "chat-delete": await window.deleteChatMessage(id); break;
      case "cv-delete-message": {
        var r2 = await rpc("hifz_delete_conversation_message", { p_id: id });
        if (r2.error) throw r2.error;
        await window.loadChatData();
        renderAll();
        toast("Сообщение удалено", { type: "info" });
        break;
      }
      case "cv-delete-group": {
        var r3 = await rpc("hifz_delete_conversation", { p_id: id });
        if (r3.error) throw r3.error;
        await window.loadChatData();
        renderAll();
        toast("Группа удалена", { type: "info" });
        break;
      }
    }
  }

  /* ---------- модалка ---------- */
  function root() {
    var r = document.getElementById(ROOT_ID);
    if (!r) {
      r = document.createElement("div");
      r.id = ROOT_ID;
      document.body.appendChild(r);
    }
    return r;
  }

  function close() {
    if (!open) return;
    open = false;
    pending = null;
    root().innerHTML = "";
    document.body.style.overflow = prevOverflow;
    document.removeEventListener("keydown", onKey, true);
    if (lastFocus && document.contains(lastFocus)) {
      try { lastFocus.focus(); } catch (e) {}
    }
    lastFocus = null;
  }

  function onKey(e) {
    if (!open) return;
    if (e.key === "Escape") {
      e.preventDefault(); e.stopPropagation();
      close();
      return;
    }
    if (e.key === "Enter") {
      var ok = root().querySelector(".hcf-ok");
      if (ok && !ok.disabled && document.activeElement.tagName !== "BUTTON") {
        e.preventDefault(); e.stopPropagation();
        ok.click();
      }
      return;
    }
    if (e.key === "Tab") {
      var f = root().querySelectorAll("button:not(:disabled), input, a[href]");
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }

  function ask(cfg, action, id, el) {
    if (open) close();
    open = true;
    pending = { action: action, id: id, el: el };
    lastFocus = document.activeElement;
    prevOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";

    var html =
      '<div class="hcf-back" data-hcf="back">' +
        '<div class="hcf-card ' + (cfg.tone === "warn" ? "warn" : "") + '" role="alertdialog" aria-modal="true" aria-labelledby="hcfTitle">' +
          '<div class="hcf-icon">' + SVG[cfg.icon] + '</div>' +
          '<div class="hcf-title" id="hcfTitle">' + E(cfg.title) + '</div>' +
          '<div class="hcf-text">' + E(cfg.text) + '</div>';

    if (cfg.target && cfg.target.name) {
      html +=
        '<div class="hcf-target">' +
          '<span class="hcf-target-av">' + E(ini(cfg.target.name)) + '</span>' +
          '<span class="hcf-target-main">' +
            '<b>' + E(cfg.target.name) + '</b>' +
            (cfg.target.sub ? '<small>' + E(cfg.target.sub) + '</small>' : "") +
          '</span>' +
        '</div>';
    }

    if (cfg.stats && cfg.stats.length) {
      html += '<div class="hcf-stats">' + cfg.stats.map(function (s) {
        return '<div class="hcf-stat"><b>' + s.n + '</b><span>' + E(s.l) + '</span></div>';
      }).join("") + '</div>';
    }

    if (cfg.note) {
      html += '<div class="hcf-note">' + SVG[cfg.noteIcon || "info"] + '<span>' + E(cfg.note) + '</span></div>';
    }

    if (cfg.word) {
      html +=
        '<label class="hcf-type">' +
          '<span>Для подтверждения введи <code>' + E(cfg.word) + '</code></span>' +
          '<input type="text" id="hcfWord" autocomplete="off" spellcheck="false" placeholder="' + E(cfg.word) + '">' +
        '</label>';
    }

    html +=
          '<div class="hcf-actions">' +
            '<button class="hcf-btn hcf-cancel" data-hcf="cancel">Отмена</button>' +
            '<button class="hcf-btn hcf-ok" data-hcf="ok"' + (cfg.word ? " disabled" : "") + '>' +
              E(cfg.ok || "Удалить") +
            '</button>' +
          '</div>' +
          '<div class="hcf-hint"><kbd>Esc</kbd> — отмена' + (cfg.word ? "" : ' · <kbd>Enter</kbd> — подтвердить') + '</div>' +
        '</div>' +
      '</div>';

    root().innerHTML = html;
    warnSound();

    var card = root().querySelector(".hcf-card");
    var okBtn = root().querySelector(".hcf-ok");
    var input = root().querySelector("#hcfWord");

    if (input) {
      input.addEventListener("input", function () {
        var good = input.value.trim().toUpperCase() === cfg.word;
        okBtn.disabled = !good;
        input.classList.toggle("ok", good);
      });
      setTimeout(function () { input.focus(); }, 70);
    } else {
      setTimeout(function () { root().querySelector(".hcf-cancel").focus(); }, 70);
    }

    root().querySelector('[data-hcf="back"]').addEventListener("mousedown", function (e) {
      if (e.target === this) close();
    });
    root().querySelector('[data-hcf="cancel"]').addEventListener("click", close);

    okBtn.addEventListener("click", async function () {
      if (okBtn.disabled || !pending) return;
      var job = pending;
      okBtn.disabled = true;
      okBtn.innerHTML = '<span class="hcf-spin"></span> Удаляем…';
      try {
        await execute(job.action, job.id, job.el);
        close();
      } catch (err) {
        close();
        try { toast(humanError(err), { type: "danger" }); } catch (e) {}
        try { Sound.play("err"); } catch (e) {}
      }
    });

    card.addEventListener("mousedown", function (e) { e.stopPropagation(); });
    document.addEventListener("keydown", onKey, true);
  }

  /* ---------- перехват ---------- */
  var GUARDED = {
    "delete-student": 1,
    "delete-passage": 1,
    "delete-view": 1,
    "clear-all": 1,
    "revoke-invite": 1,
    "reject-request": 1,
    "chat-delete": 1,
    "cv-delete-message": 1,
    "cv-delete-group": 1,
    "archive-student": 1
  };

  window.addEventListener("click", function (e) {
    if (open) return;
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

    var t = e.target.closest ? e.target.closest("[data-action]") : null;
    if (!t) return;
    if (t.closest("#" + ROOT_ID)) return;

    var a = t.dataset.action;
    if (!GUARDED[a]) return;

    var id = t.dataset.id;

    if (a === "archive-student") {
      var s = null;
      try { s = byId(id); } catch (err) {}
      if (s && s.archived) return;
    }

    e.preventDefault();
    e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();

    ask(describe(a, id, t), a, id, { dataset: Object.assign({}, t.dataset) });
  }, true);

  window.addEventListener("hifz-confirm", function (e) {
    var d = e.detail || {};
    if (d.action) ask(describe(d.action, d.id, d.el || { dataset: {} }), d.action, d.id, d.el || { dataset: {} });
  });
})();
</script>

  function mountButton() {

<script>
/* ==========================================================
   HIFZ · РАЗДЕЛЬНЫЕ ЖУРНАЛЫ
   Вставь ПЕРЕД </body> ПОСЛЕ всех остальных хотфиксов.
   У каждого учителя свой журнал. Владелец переключается между всеми.
   ========================================================== */
(function () {
  if (window.__hifzJournals) return;
  window.__hifzJournals = true;

  var ACTIVE = null;          // null = свой журнал, иначе user_id чужого
  var JOURNALS = [];
  var jChannel = null;
  var loadingList = false;

  function own() { try { return member || null; } catch (e) { return null; } }
  function staff() { try { return typeof isStaff === "function" && isStaff(); } catch (e) { return false; } }
  function owner() { try { return typeof isOwner === "function" && isOwner(); } catch (e) { return false; } }
  function E(s) { return typeof esc === "function" ? esc(s) : String(s == null ? "" : s); }
  function say(m, t) { try { toast(m, { type: t || "info" }); } catch (e) {} }
  function ico(n, s) { try { return icon(n, s); } catch (e) { return ""; } }

  function journalName(id) {
    if (!id || (own() && id === own().user_id)) return "Мой журнал";
    var j = JOURNALS.find(function (x) { return x.user_id === id; });
    return j ? j.name : "Журнал учителя";
  }

  function cacheKeyNow() {
    var m = own();
    return "hifz-data-v8:" + (m ? m.user_id : "anon") + ":" + (ACTIVE || "self");
  }

  /* ---------- кэш по журналу ---------- */
  window.loadCache = function () {
    try {
      var raw = JSON.parse(localStorage.getItem(cacheKeyNow()));
      return validState(raw) ? normalize(raw) : null;
    } catch (e) { return null; }
  };

  /* ---------- чтение / запись с учётом журнала ---------- */
  window.pullState = async function () {
    sync.status = "syncing";
    updateSyncUI();
    var res = await client.rpc("hifz_get_state", { p_owner: ACTIVE });
    if (res.error) throw res.error;
    state = normalize(res.data);
    sync.rev = res.data.rev == null ? 0 : res.data.rev;
    sync.last = new Date();
    sync.status = "synced";
    sync.dirty = false;
    window.__hifzJournalOwner = res.data.journal_owner || null;
    try { cacheKey = cacheKeyNow(); } catch (e) {}
    writeCache();
    renderAll();
  };

  window.pushState = async function () {
    if (!staff()) return;
    sync.status = "syncing";
    updateSyncUI();
    var res = await client.rpc("hifz_save_state", {
      new_data: payload(),
      expected_rev: sync.rev,
      p_owner: ACTIVE
    });
    if (res.error) {
      if (/CONFLICT/i.test(res.error.message || "")) {
        await window.pullState();
        say("Журнал обновился на другом устройстве — загружена свежая версия", "info");
        return;
      }
      throw res.error;
    }
    sync.rev = res.data.rev;
    state.meta.updatedAt = res.data.updated_at;
    sync.last = new Date();
    sync.dirty = false;
    sync.status = "synced";
    writeCache();
    updateSyncUI();
  };

  if (typeof window.enterCloud === "function") {
    var _enter = window.enterCloud;
    window.enterCloud = async function () {

      JOURNALS = [];
      var r = await _enter.apply(this, arguments);
      if (owner()) loadJournals().catch(function () {});
      return r;
    };
  }

  /* ---------- realtime своего журнала ---------- */
  var _sub = window.subscribeCloud;
  var _unsub = window.unsubscribeCloud;

  window.unsubscribeCloud = function () {
    if (jChannel) { try { client.removeChannel(jChannel); } catch (e) {} jChannel = null; }
    if (typeof _unsub === "function") _unsub.apply(this, arguments);
  };

  window.subscribeCloud = function () {
    if (typeof _sub === "function") _sub.apply(this, arguments);
    var m = own();
    if (!client || !m || !staff()) return;
    var target = ACTIVE || m.user_id;
    try {
      jChannel = client.channel("hifz-journal-" + target)
        .on("postgres_changes",
          { event: "*", schema: "public", table: "hifz_journals", filter: "owner_id=eq." + target },
          function (p) {

          })
        .subscribe();
    } catch (e) {}
  };

  /* ---------- список журналов ---------- */
  async function loadJournals() {
    if (!owner() || loadingList) return;
    loadingList = true;
    try {
      var res = await rpc("hifz_list_journals");
      if (!res.error) JOURNALS = res.data || [];
    } catch (e) {} finally { loadingList = false; }
  }

  /* ---------- кнопка журнала в шапке ---------- */
  function mountChip() {
    var host = document.getElementById("topActions");
    if (!host || !staff()) return;
    var m = own();
    if (!m) return;

    var chip = document.getElementById("hjChip");
    if (!chip) {
      chip = document.createElement("button");
      chip.id = "hjChip";
      chip.className = "chip-btn hj-chip";
      chip.type = "button";
      chip.addEventListener("click", function (e) {
        e.stopPropagation();
        if (owner()) openJournals(); else openMyInvites();
      });
      host.insertBefore(chip, host.firstChild);
    }

    if (owner()) {
      chip.innerHTML = ico("book", 15) + "<span>" + E(journalName(ACTIVE)) + "</span>";
      chip.title = "Переключить журнал";
      chip.classList.toggle("hj-foreign", !!ACTIVE);
    } else {
      chip.innerHTML = ico("mail", 15) + "<span>Приглашения</span>";
      chip.title = "Пригласить ученицу в свой журнал";
      chip.classList.remove("hj-foreign");
    }
  }

  if (typeof window.renderHeader === "function") {
    var _rh = window.renderHeader;
    window.renderHeader = function () {
      var r = _rh.apply(this, arguments);
      mountChip();
      return r;
    };
  }

  /* ---------- полоса «чужой журнал» + наставник в команде ---------- */
  function decorate() {
    var main = document.getElementById("main");
    if (main && staff()) {
      var bar = document.getElementById("hjBanner");
      if (ACTIVE) {
        if (!bar) {
          bar = document.createElement("div");
          bar.id = "hjBanner";
          bar.className = "hj-banner";
          main.insertBefore(bar, main.firstChild);
        }
        bar.innerHTML =
          ico("alert", 16) +
          "<span>Открыт чужой журнал: <b>" + E(journalName(ACTIVE)) + "</b>. Все изменения сохраняются ему.</span>" +
          '<button class="btn soft sm" data-action="hj-back-own">Вернуться к своему</button>';
      } else if (bar) {
        bar.remove();
      }
    }

    if (typeof ui !== "undefined" && ui.view === "team") decorateTeam();
  }

  function decorateTeam() {
    var staffList = (typeof team !== "undefined" ? team : []).filter(function (m) {
      return m.role === "owner" || m.role === "teacher";
    });

    document.querySelectorAll("[data-member-role]").forEach(function (sel) {
      var uid = sel.dataset.memberRole;
      var row = sel.closest(".member-row");
      if (!row) return;
      var controls = row.querySelector(".member-controls");
      if (!controls) return;

      var exist = controls.querySelector('[data-member-mentor="' + uid + '"]');
      if (sel.value !== "student") { if (exist) exist.remove(); return; }
      if (exist) return;

      var rec = (typeof team !== "undefined" ? team : []).find(function (m) { return m.user_id === uid; }) || {};

          E(m.name || m.email || "Участник") + "</option>";

      controls.insertBefore(s, saveBtn || null);
    });

  if (typeof window.renderView === "function") {
    var _rv = window.renderView;
    window.renderView = function () {
      var r = _rv.apply(this, arguments);
      setTimeout(decorate, 30);
      return r;

    out.push(stage("dbkey", "Ключ в базе",
      keySet ? "ok" : "bad",
      keySet ? (s.config_key_len + " символов") : "hifz_push_config пустой",
      keySet ? null : "syncKey",
      "Публичный VAPID-ключ должен лежать в таблице hifz_push_config — оттуда его читает браузер."));

    var match = c.sub && keySet && c.subKey && c.subKey === s.config_key;
    out.push(stage("match", "Ключ совпадает",
      !c.sub || !keySet ? "idle" : (match ? "ok" : "bad"),
      !c.sub || !keySet ? "Нечего сравнивать" : match ? "Подписка и база согласованы" : "Подписка сделана другим ключом",
      c.sub && keySet && !match ? "resub" : null,
      "Если браузер подписан старым ключом, а сервер шлёт новым — push отклоняется. Нужна переподписка."));

    var rows = s.subs || [];
    var saved = rows.some(function (r) { return r.endpoint === c.endpoint; });
    out.push(stage("row", "Запись в базе",
      !c.sub ? "idle" : saved ? "ok" : "bad",
      !c.sub ? "Нет подписки" : saved ? ("Устройств: " + rows.length) : "Endpoint не сохранён",
      c.sub && !saved ? "saveRow" : null,
      "Подписка должна быть в hifz_push_subs, иначе рассылка не знает, куда слать."));

    out.push(stage("secret", "Секрет сервера",
      s.secret_set ? "ok" : "bad",
      s.secret_set ? (s.secret_len + " символов") : "Vault пуст или placeholder",
      s.secret_set ? null : "secret",
      "Триггеры читают секрет из Vault. Без них запрос к edge-функции не отправляется вообще."));

    var logs = s.http_logs || [];
    var last = logs[0];
    var fnState = "idle", fnNote = "Вызовов ещё не было";
    if (last) {
      if (last.error || last.timed_out) { fnState = "bad"; fnNote = "Сеть: " + (last.error || "timeout"); }
      else if (last.status === 200) { fnState = "ok"; fnNote = "200 OK · " + ago(last.created); }
      else if (last.status === 401) { fnState = "bad"; fnNote = "401 — PUSH_SECRET не совпадает"; }
      else if (last.status === 404) { fnState = "bad"; fnNote = "404 — функция не задеплоена"; }
      else if (last.status === 500) { fnState = "bad"; fnNote = "500 — нет VAPID-ключей в Secrets"; }
      else { fnState = "warn"; fnNote = last.status + " · " + ago(last.created); }
    }
    out.push(stage("edge", "Edge-функция", fnState, fnNote, null,
      "Последний ответ функции рассылки. 200 — доставлено, 401 — секрет, 404 — нет функции, 500 — нет ключей."));

    var prefChat = !s.prefs || s.prefs.chat !== false;
    out.push(stage("prefs", "Тип «Чат»",
      prefChat ? "ok" : "warn",
      prefChat ? "Включён" : "Выключен в настройках",
      prefChat ? null : "enableChat",
      "В личных настройках уведомлений тип «Сообщения чата» должен быть включён."));

    var quiet = s.prefs && s.prefs.quiet_on;
    var inQuiet = false;
    if (quiet) {
      var off = (s.prefs.tz_offset || 0);
      var now = new Date(Date.now() + off * 60000);
      var cur = now.getUTCHours() * 60 + now.getUTCMinutes();
      var f = String(s.prefs.quiet_from || "23:00").split(":").map(Number);
      var t = String(s.prefs.quiet_to || "07:00").split(":").map(Number);
      var from = f[0] * 60 + f[1], to = t[0] * 60 + t[1];
      inQuiet = from <= to ? (cur >= from && cur < to) : (cur >= from || cur < to);
    }
    out.push(stage("quiet", "Тихие часы",
      !quiet ? "ok" : inQuiet ? "warn" : "ok",
      !quiet ? "Отключены" : inQuiet ? ("Сейчас тихо до " + s.prefs.quiet_to) : ("Сейчас можно · " + s.prefs.quiet_from + "–" + s.prefs.quiet_to),
      inQuiet ? "quietOff" : null,
      "В тихие часы рассылка молчит намеренно — это не поломка."));

    out.push(stage("trig", "Триггеры",
      (s.triggers || 0) >= 3 ? "ok" : "bad",
      (s.triggers || 0) + " шт.",
      null,
      "Триггер на hifz_chat_messages отправляет push при каждом новом сообщении."));

    D.stages = out;
  }

  function health() {
    var bad = D.stages.filter(function (s) { return s.state === "bad"; }).length;
    var warn = D.stages.filter(function (s) { return s.state === "warn"; }).length;
    if (bad) return { key: "bad", label: "Цепочка разорвана", n: bad };
    if (warn) return { key: "warn", label: "Есть предупреждения", n: warn };
    return { key: "ok", label: "Всё готово к доставке", n: 0 };
  }

  /* ---------- исправления ---------- */
  async function runFix(kind) {
    D.busy = true; paint();
    try {
      if (kind === "ask" || kind === "resub" || kind === "saveRow") {
        var reg = await navigator.serviceWorker.register("/sw.js", { scope: "/" });
        await navigator.serviceWorker.ready;
        var perm = await Notification.requestPermission();
        if (perm !== "granted") throw new Error("Разрешение не выдано");

        var s = D.server || {};
        if (!s.config_key) throw new Error("Сначала задай публичный ключ в базе");

        var old = await reg.pushManager.getSubscription();
        if (old && kind === "resub") { await old.unsubscribe().catch(function () {}); old = null; }

        var sub = old || await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: fromB64url(s.config_key)
        });

        var j = sub.toJSON();
        var m = mem();
        var r = await client.from("hifz_push_subs").upsert({
          endpoint: j.endpoint, user_id: m.user_id,
          p256dh: j.keys.p256dh, auth: j.keys.auth,
          ua: navigator.userAgent.slice(0, 240),
          platform: /iPad|iPhone|iPod/.test(navigator.userAgent) ? "iOS" : /Android/.test(navigator.userAgent) ? "Android" : "Desktop",
          seen_at: new Date().toISOString()
        }, { onConflict: "endpoint" });
        if (r.error) throw r.error;
        say("Подписка обновлена"); sfx("good");
      }

      if (kind === "syncKey") {
        var reg2 = await navigator.serviceWorker.getRegistration("/");
        var sub2 = reg2 ? await reg2.pushManager.getSubscription() : null;
        if (!sub2 || !sub2.options.applicationServerKey) throw new Error("Нет подписки, откуда взять ключ");
        var k = b64url(sub2.options.applicationServerKey);
        var u = await client.from("hifz_push_config").update({ vapid_public: k, updated_at: new Date().toISOString() }).eq("id", 1);
        if (u.error) throw u.error;
        say("Ключ из подписки записан в базу. Обнови VAPID_PUBLIC_KEY в Secrets тем же значением.", "info");
        sfx("good");
      }

      if (kind === "enableChat" || kind === "quietOff") {
        var m2 = mem();
        var patch = { user_id: m2.user_id, updated_at: new Date().toISOString() };
        if (kind === "enableChat") patch.chat = true;
        if (kind === "quietOff") patch.quiet_on = false;
        var q = await client.from("hifz_push_prefs").upsert(patch);
        if (q.error) throw q.error;
        say("Настройка изменена"); sfx("tick");
      }

      if (kind === "secret") {
        say("Секрет задаётся только через SQL — скопирован запрос в буфер", "info");
        await navigator.clipboard.writeText(
          "do $$\ndeclare ns text; sid uuid;\nbegin\n  ns := encode(gen_random_bytes(32),'hex');\n  select id into sid from vault.secrets where name='hifz_push_secret';\n  if sid is null then perform vault.create_secret(ns,'hifz_push_secret');\n  else perform vault.update_secret(sid, ns); end if;\nend $$;\n\nselect decrypted_secret as copy_to_push_secret from vault.decrypted_secrets where name='hifz_push_secret';"
        );
      }

      if (kind === "install") {
        say("Safari → Поделиться → На экран «Домой» → открой иконку", "info");
      }

      await collect();
    } catch (e) {
      say(herr(e), "danger"); sfx("bad");
      await collect();
    } finally {
      D.busy = false; paint();
    }
  }

  async function probePush() {
    D.busy = true; D.lastFlow = Date.now(); paint(); sfx("send");
    try {
      var r = await rpc("hifz_push_probe");
      if (r.error) throw r.error;
      var d = r.data || {};
      if (!d.dispatched) say(d.reason || "Канал отправки не готов", "danger");
      else if (!d.subscriptions) say("Запрос ушёл, но подписок нет", "warn");
      else say("Запрос отправлен в очередь. Ждём ответ функции…", "info");
      setTimeout(async function () { await collect(); paint(); report(); }, 2600);
    } catch (e) { say(herr(e), "danger"); sfx("bad"); }
    finally { D.busy = false; paint(); }
  }

  async function probeChat() {
    D.busy = true; D.lastFlow = Date.now(); paint(); sfx("send");
    try {
      var r = await rpc("hifz_push_probe_chat");
      if (r.error) throw r.error;
      say("Сообщение в общем чате создано — триггер должен отправить push", "info");
      setTimeout(async function () { await collect(); paint(); report(); }, 3000);
    } catch (e) { say(herr(e), "danger"); sfx("bad"); }
    finally { D.busy = false; paint(); }
  }

  function report() {
    var last = (D.server && D.server.http_logs || [])[0];
    if (!last) return;
    if (last.status === 200) { say("Функция ответила 200 — доставка прошла", "success"); sfx("good"); }
    else { say("Функция ответила " + (last.status || "ошибкой") + " — смотри журнал ниже", "danger"); sfx("bad"); }
  }

  function reportText() {
    var h = health();
    var lines = ["ЖУРНАЛ ХИФЗА · ДИАГНОСТИКА PUSH", new Date().toLocaleString("ru-RU"), "Статус: " + h.label, ""];
    D.stages.forEach(function (s) {
      lines.push((s.state === "ok" ? "[OK]  " : s.state === "bad" ? "[FAIL]" : s.state === "warn" ? "[WARN]" : "[ — ] ") + " " + s.label + " — " + s.note);
    });
    lines.push("", "ПОСЛЕДНИЕ ВЫЗОВЫ:");
    (D.server && D.server.http_logs || []).slice(0, 8).forEach(function (l) {
      lines.push(hhmm(l.created) + " · " + (l.status || "err") + " · " + (l.error || "") + " " + String(l.body || "").slice(0, 120));
    });
    return lines.join("\n");
  }

  /* ---------- разметка ---------- */
  function chainHTML() {
    var list = D.onlyBad ? D.stages.filter(function (s) { return s.state !== "ok" && s.state !== "idle"; }) : D.stages;
    if (!list.length) return '<div class="dg-allgood">Все звенья в порядке — цепочка доставки целая.</div>';
    var flowing = Date.now() - D.lastFlow < 3200;
    return '<div class="dg-chain ' + (flowing ? "flow" : "") + '">' + list.map(function (s, i) {
      return '<button class="dg-node ' + s.state + '" data-dg="stage" data-id="' + s.id + '" style="--n:' + i + '">' +
        '<span class="dg-dot"><i></i></span>' +
        '<span class="dg-body"><b>' + E(s.label) + '</b><small>' + E(s.note) + '</small></span>' +
        '<span class="dg-mark">' + (s.state === "ok" ? "✓" : s.state === "bad" ? "!" : s.state === "warn" ? "~" : "·") + '</span>' +
      '</button>';
    }).join("") + '</div>';
  }

  function logsHTML() {
    var logs = (D.server && D.server.http_logs) || [];
    if (!logs.length) return '<div class="dg-empty">Вызовов функции ещё не было. Нажми «Тест push», чтобы создать первый.</div>';
    return '<div class="dg-logs">' + logs.map(function (l, i) {
      var cls = l.error || l.timed_out ? "bad" : l.status === 200 ? "ok" : "warn";
      var open = !!D.logsOpen[i];
      return '<div class="dg-log ' + cls + '">' +
        '<button class="dg-log-head" data-dg="log" data-i="' + i + '">' +
          '<span class="dg-code">' + (l.status || "ERR") + '</span>' +
          '<span class="dg-when">' + hhmm(l.created) + '</span>' +
          '<span class="dg-ago">' + ago(l.created) + '</span>' +
          '<span class="dg-caret">' + (open ? "▾" : "▸") + '</span>' +
        '</button>' +
        (open ? '<pre class="dg-log-body">' + E(l.error || l.body || "(пустой ответ)") + '</pre>' : "") +
      '</div>';
    }).join("") + '</div>';
  }

  function detailHTML() {
    var s = D.stages.find(function (x) { return x.id === D.detail; });
    if (!s) return "";
    return '<div class="dg-detail ' + s.state + '">' +
      '<div class="dg-detail-top"><b>' + E(s.label) + '</b>' +
        '<button class="dg-x" data-dg="detail-close">✕</button></div>' +
      '<p>' + E(s.hint) + '</p>' +
      '<div class="dg-detail-now">Сейчас: ' + E(s.note) + '</div>' +
      (s.fix ? '<button class="btn primary block" data-dg="fix" data-kind="' + s.fix + '"' + (D.busy ? " disabled" : "") + '>Исправить</button>' : "") +
    '</div>';
  }

  function paint() {
    var root = document.getElementById("dgRoot");
    if (!root) return;
    var h = health();
    var c = D.client || {}, s = D.server || {};

    root.innerHTML =
      '<div class="dg-shell ' + h.key + '">' +
        '<header class="dg-top">' +
          '<div class="dg-title">' +
            '<span class="dg-pulse"></span>' +
            '<div><h3>Диагностика доставки</h3><small>' + E(h.label) + (h.n ? " · " + h.n : "") + '</small></div>' +
          '</div>' +
          '<div class="dg-top-actions">' +
            '<button class="dg-icon ' + (D.sound ? "on" : "") + '" data-dg="sound" title="Звук">' + (D.sound ? "🔊" : "🔇") + '</button>' +
            '<button class="dg-icon" data-dg="close" title="Закрыть">✕</button>' +
          '</div>' +
        '</header>' +

        '<div class="dg-controls">' +
          '<button class="dg-ctl primary" data-dg="refresh"' + (D.busy ? " disabled" : "") + '>↻ Обновить</button>' +
          '<button class="dg-ctl accent" data-dg="probe"' + (D.busy ? " disabled" : "") + '>Тест push</button>' +
          '<button class="dg-ctl accent2" data-dg="probe-chat"' + (D.busy ? " disabled" : "") + '>Сообщение в чат</button>' +
          '<label class="dg-ctl toggle"><input type="checkbox" data-dg="auto" ' + (D.auto ? "checked" : "") + '><i></i><span>Авто</span></label>' +
          '<div class="dg-ctl stepper"><span>Каждые</span>' +
            '<button data-dg="step" data-d="-5">−</button><b>' + D.every + 'с</b><button data-dg="step" data-d="5">+</button>' +
          '</div>' +
          '<label class="dg-ctl toggle"><input type="checkbox" data-dg="onlybad" ' + (D.onlyBad ? "checked" : "") + '><i></i><span>Только проблемы</span></label>' +
          '<button class="dg-ctl" data-dg="resub"' + (D.busy ? " disabled" : "") + '>Переподписать</button>' +
          '<button class="dg-ctl" data-dg="copy">Копировать отчёт</button>' +
          '<button class="dg-ctl" data-dg="export">Скачать JSON</button>' +
        '</div>' +

        (c.serverErr ? '<div class="dg-banner bad">Серверная диагностика недоступна: ' + E(c.serverErr) + '. Выполни SQL-патч диагностики.</div>' : "") +
        (c.err ? '<div class="dg-banner warn">Браузер: ' + E(c.err) + '</div>' : "") +

        '<section class="dg-section">' +
          '<div class="dg-sec-head"><b>Цепочка доставки</b><span>' + D.stages.filter(function (x) { return x.state === "ok"; }).length + ' / ' + D.stages.length + ' в порядке</span></div>' +
          chainHTML() +
          detailHTML() +
        '</section>' +

        '<section class="dg-section">' +
          '<div class="dg-sec-head"><b>Ответы функции рассылки</b><span>' + ((s.http_logs || []).length) + ' записей</span></div>' +
          logsHTML() +
        '</section>' +

        '<section class="dg-section">' +
          '<div class="dg-sec-head"><b>Состояние сервера</b></div>' +
          '<div class="dg-facts">' +
            fact("Ключ в базе", s.config_key_set ? s.config_key_len + " симв." : "нет", s.config_key_set ? "ok" : "bad") +
            fact("Секрет", s.secret_set ? s.secret_len + " симв." : "нет", s.secret_set ? "ok" : "bad") +
            fact("Триггеры", String(s.triggers || 0), (s.triggers || 0) >= 3 ? "ok" : "bad") +
            fact("Cron", s.cron ? "активен" : "нет", s.cron ? "ok" : "warn") +
            fact("Устройств", String((s.subs || []).length), (s.subs || []).length ? "ok" : "bad") +
            fact("Диалогов", String(s.memberships || 0), (s.memberships || 0) ? "ok" : "warn") +
            fact("Сообщений", String(s.messages || 0), "idle") +
            fact("Подписка", c.sub ? "есть" : "нет", c.sub ? "ok" : "bad") +
          '</div>' +
        '</section>' +
      '</div>';
  }

  function fact(label, value, state) {
    return '<div class="dg-fact ' + state + '"><b>' + E(value) + '</b><span>' + E(label) + '</span></div>';
  }

  function openPanel() {
    D.open = true;
    var host = document.getElementById("dgHost");
    if (!host) {
      host = document.createElement("div");
      host.id = "dgHost";
      host.className = "dg-host";
      host.innerHTML = '<div class="dg-scrim" data-dg="close"></div><div id="dgRoot" class="dg-panel"></div>';
      document.body.appendChild(host);
    }
    host.classList.add("on");
    document.body.style.overflow = "hidden";
    paint();
    collect().then(function () { paint(); sfx("tick"); });
    restartTimer();
  }

  function closePanel() {
    D.open = false;
    var host = document.getElementById("dgHost");
    if (host) host.classList.remove("on");
    document.body.style.overflow = "";
    if (D.timer) { clearInterval(D.timer); D.timer = null; }
  }

  function restartTimer() {
    if (D.timer) clearInterval(D.timer);
    if (!D.auto || !D.open) return;
    D.timer = setInterval(function () {
      if (!D.busy) collect().then(paint);
    }, D.every * 1000);
  }
